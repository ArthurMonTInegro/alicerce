# Rollback da demonstração no GitHub Pages (Settings → Pages → Deploy from a branch → gh-pages).
# A publicação normal fica no CI (.github/workflows/ci.yml, job pages-publicar) e só
# acontece depois que todos os testes passam no mesmo commit da main.
# Aqui nada é reconstruído: o rollback pega a árvore de uma publicação anterior do
# gh-pages e a publica como um commit novo, sem force push. Detalhes em docs/PUBLICACAO.md.
name: Pages (rollback)
on:
  workflow_dispatch:
    inputs:
      versao:
        description: 'anterior = volta uma publicação; listar = só mostra o histórico; ou o commit do gh-pages ou da main (7 a 40 caracteres)'
        required: true
        default: anterior
        type: string
      motivo:
        description: 'Motivo (vai para a mensagem do commit)'
        required: false
        type: string
permissions: {}
jobs:
  listar:
    if: github.ref == 'refs/heads/main' && inputs.versao == 'listar'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: scripts
      - name: Histórico do gh-pages
        env:
          PAGES_TOKEN: ${{ github.token }}
        run: bash scripts/publish-pages.sh listar --quantas 30

  rollback:
    if: github.ref == 'refs/heads/main' && inputs.versao != 'listar'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: pages-publicacao
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: scripts
      # As entradas chegam por variável de ambiente, nunca interpoladas no script.
      - name: Republicar a versão escolhida
        env:
          PAGES_TOKEN: ${{ github.token }}
          VERSAO: ${{ inputs.versao }}
          MOTIVO: ${{ inputs.motivo }}
        run: >-
          bash scripts/publish-pages.sh rollback
          --versao "$VERSAO"
          --motivo "$MOTIVO"
          --autor "$GITHUB_ACTOR"
          --execucao "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
      - name: Histórico depois do rollback
        env:
          PAGES_TOKEN: ${{ github.token }}
        run: bash scripts/publish-pages.sh listar --quantas 10
