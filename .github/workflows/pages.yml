# Publica a versão de demonstração (só o site estático, sem servidor) no GitHub Pages.
name: Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          VITE_STATIC: '1'
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
      # publica o build no branch gh-pages (Settings → Pages → Deploy from a branch → gh-pages)
      - name: Publicar no branch gh-pages
        run: |
          cd apps/web/dist
          find . -name '*.map' -delete
          touch .nojekyll
          git init -q -b gh-pages
          git add -A
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -q -m "Publica ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages
