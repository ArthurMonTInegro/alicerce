name: CI
on:
  push:
    branches: [main]
  pull_request:
# Nenhuma permissão por padrão; cada job pede só o que usa.
permissions: {}
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Nenhuma dependência precisa de script de instalação no Linux (só o fsevents, que é do macOS, tem um).
      - run: npm ci --ignore-scripts
      # Sem o repositório privado (conteúdo pago): tudo aqui cobre os níveis 0 e 1 e o
      # mapa público. As verificações completas rodam no CI do repositório privado.
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:solutions
      # build estático (o do GitHub Pages) numa pasta à parte, para e2e/pages.spec.ts
      - run: npm run build
        env:
          BASE_PATH: /alicerce/
          VITE_STATIC: '1'
      - run: cp -r apps/web/dist "$RUNNER_TEMP/pages-dist"
      - run: npm run build
      - name: Auditoria do build (só lições gratuitas com corpo)
        run: node scripts/verify-access-build.ts
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CI: '1'
          PAGES_DIST: ${{ runner.temp }}/pages-dist
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results

  # Versão estática da demonstração (GitHub Pages): roda também em pull requests,
  # para que um vazamento de conteúdo Premium no build público falhe antes do merge.
  pages-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Testar o script de publicação (repositório temporário, sem rede)
        run: bash scripts/test-publish-pages.sh
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Build estático
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          VITE_STATIC: '1'
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
      - name: Auditoria de acesso do build
        run: node scripts/verify-access-build.ts
      - name: Preparar a pasta publicada
        run: |
          find apps/web/dist -name '*.map' -delete
          touch apps/web/dist/.nojekyll
      - uses: actions/upload-artifact@v4
        with:
          name: pages-site
          path: apps/web/dist
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
          # "Re-run all jobs" sobe o artefato de novo na mesma execução.
          overwrite: true

  # Publica no branch gh-pages só em push na main e só se check (typecheck, testes,
  # soluções, build e e2e) e pages-build (build estático e auditoria) passaram
  # neste mesmo commit. O build publicado é o artefato do pages-build desta execução.
  # Este job não roda npm: o token com escrita só existe no passo do push.
  pages-publicar:
    needs: [check, pages-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: pages-publicacao
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: scripts
      - uses: actions/download-artifact@v4
        with:
          name: pages-site
          path: ${{ runner.temp }}/site
      - name: Publicar no gh-pages (commit novo, sem force push)
        env:
          PAGES_TOKEN: ${{ github.token }}
        run: >-
          bash scripts/publish-pages.sh publicar
          --dist "$RUNNER_TEMP/site"
          --fonte "$GITHUB_SHA"
          --exigir-ponta main
          --execucao "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
